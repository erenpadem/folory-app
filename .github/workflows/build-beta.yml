# Beta imajları — manuel tetikle (yazar feedback / beta.fo-lory.com)
# GitHub → Actions → Build Beta → Run workflow
# Sunucu: BETA_TAG=beta ./scripts/bootstrap-beta.sh beta

name: Build Beta

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NEXT_PUBLIC_API_URL: https://beta.fo-lory.com
  NEXT_PUBLIC_SITE_URL: https://beta.fo-lory.com
  NEXT_PUBLIC_APP_ENV: beta

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: docker/production/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: Dockerfile
            target: runner
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: meta
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "image=${{ env.REGISTRY }}/${REPO}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=beta
            type=sha,prefix=beta-,length=7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        if: matrix.service == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/production/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_ENV=${{ env.NEXT_PUBLIC_APP_ENV }}
