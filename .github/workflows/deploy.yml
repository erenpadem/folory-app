name: Deploy

on:
  workflow_run:
    workflows: [Build and Push]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag (sha, latest, or semver tag)"
        required: false
        default: latest

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [[ ! -d "$DEPLOY_PATH" ]]; then
              echo "Deploy dizini yok: $DEPLOY_PATH" >&2
              echo "Sunucuda bir kez: bash -c \"curl -fsSL ...\" veya setup-repo.sh çalıştırın." >&2
              exit 1
            fi
            if [[ -f "$DEPLOY_PATH/scripts/git-sync.sh" ]]; then
              bash "$DEPLOY_PATH/scripts/git-sync.sh" "$DEPLOY_PATH"
            else
              REPO_DIR="$(dirname "$DEPLOY_PATH")"
              cd "$REPO_DIR"
              git remote set-url origin git@github.com:erenpadem/folory-app.git
              GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new" git pull --ff-only origin main || git pull --ff-only origin master
            fi
            cd "$DEPLOY_PATH"
            chmod +x scripts/*.sh
            ./scripts/deploy.sh "${{ steps.tag.outputs.value }}"
