name: Deploy

on:
  workflow_run:
    workflows: [Build and Push]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag (sha, latest, or semver tag)"
        required: false
        default: latest

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check deploy secrets
        id: config
        env:
          # Inline ${{ secrets.* }} boşluk kontrolü güvenilir değil; env üzerinden bak
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          missing=()
          # Değerleri loglama — sadece uzunluk (maskelenmiş secret sızıntısı olmasın)
          echo "DEPLOY_HOST length: ${#DEPLOY_HOST}"
          echo "DEPLOY_USER length: ${#DEPLOY_USER}"
          echo "DEPLOY_PATH length: ${#DEPLOY_PATH}"
          echo "DEPLOY_SSH_KEY length: ${#SSH_KEY}"
          echo "DEPLOY_SSH_KEY_B64 length: ${#SSH_KEY_B64}"

          [ -z "${DEPLOY_HOST//[[:space:]]/}" ] && missing+=("DEPLOY_HOST")
          [ -z "${DEPLOY_USER//[[:space:]]/}" ] && missing+=("DEPLOY_USER")
          [ -z "${DEPLOY_PATH}" ] && missing+=("DEPLOY_PATH")
          if [ -z "${SSH_KEY_B64}" ] && [ -z "${SSH_KEY}" ]; then
            missing+=("DEPLOY_SSH_KEY_B64 veya DEPLOY_SSH_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy atlandı — eksik/boş: ${missing[*]}"
            echo "Not: Secret'lar Repository secrets altında olmalı (Environment secrets değil)."
            echo "Settings → Secrets and variables → Actions → Repository secrets"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key file
        if: steps.config.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          KEY_FILE="$HOME/.ssh/deploy_key"

          if [ -n "$SSH_KEY_B64" ]; then
            echo "$SSH_KEY_B64" | tr -d '\n\r ' | base64 -d > "$KEY_FILE"
          else
            printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
            sed -i 's/\r$//' "$KEY_FILE"
          fi

          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -f "$KEY_FILE" > /dev/null 2>&1; then
            echo "::error::SSH key geçersiz. DEPLOY_SSH_KEY_B64 kullan (önerilen)."
            exit 1
          fi

          echo "GitHub Actions key fingerprint (sunucudaki authorized_keys ile aynı olmalı):"
          ssh-keygen -lf "$KEY_FILE"

      - name: Resolve image tag
        if: steps.config.outputs.configured == 'true'
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="latest"
          else
            FULL_SHA="${{ github.event.workflow_run.head_sha }}"
            # GHCR: kısa sha (3e2e019) + latest; tam sha da build sonrası eklenir
            TAG="${FULL_SHA:0:7}"
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploy image tag: ${TAG}"

      - name: Deploy via SSH
        if: steps.config.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          KEY_FILE="$HOME/.ssh/deploy_key"

          # Secret'lardaki satır sonu/boşluk temizle (GitHub UI bazen ekler)
          DEPLOY_USER="$(printf '%s' "$DEPLOY_USER" | tr -d '\r\n[:space:]')"
          DEPLOY_HOST="$(printf '%s' "$DEPLOY_HOST" | tr -d '\r\n[:space:]')"
          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n')"
          DEPLOY_PORT="$(printf '%s' "${DEPLOY_PORT:-22}" | tr -d '\r\n[:space:]')"

          if ! [[ "$DEPLOY_USER" =~ ^[a-zA-Z][a-zA-Z0-9._-]*$ ]]; then
            echo "::error::DEPLOY_USER geçersiz: [$DEPLOY_USER]"
            echo "GitHub secret'ı sadece şu olmalı: root (başında/sonunda boşluk yok)"
            exit 1
          fi

          echo "SSH: ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PORT}"

          ssh -i "$KEY_FILE" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' IMAGE_TAG='${IMAGE_TAG}' bash -s" <<'REMOTE'
          set -euo pipefail
          if [[ ! -d "$DEPLOY_PATH" ]]; then
            echo "Deploy dizini yok: $DEPLOY_PATH" >&2
            exit 1
          fi
          REPO_DIR="$(dirname "$DEPLOY_PATH")"
          cd "$REPO_DIR"
          git remote set-url origin git@github.com:erenpadem/folory-app.git
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
          git fetch origin
          # Eski git-sync.sh pull kullanıyorsa bile önce origin/main'e zorla (yerel script değişiklikleri atılır)
          git reset --hard origin/main 2>/dev/null || git reset --hard origin/master
          echo "Repo sync: $(git rev-parse --short HEAD)"
          if [[ -f "$DEPLOY_PATH/scripts/git-sync.sh" ]]; then
            bash "$DEPLOY_PATH/scripts/git-sync.sh" "$DEPLOY_PATH"
          fi
          cd "$DEPLOY_PATH"
          chmod +x scripts/*.sh
          ./scripts/deploy.sh "$IMAGE_TAG"
          REMOTE

      - name: Deploy skipped (secrets not configured)
        if: steps.config.outputs.configured != 'true'
        run: |
          echo "Secrets eksik. Sunucuda manuel: cd /opt/folory/deploy && ./scripts/deploy.sh latest"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            exit 1
          fi
