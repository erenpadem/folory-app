services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/development/workspace/Dockerfile
    image: folory-backend  # <-- Burada image adı tanımlanıyor
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - APP_URL=${APP_URL:-http://localhost:8081}
    networks:
      - folory-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  webserver:
    image: nginx:latest
    ports:
      - "${WEBSERVER_PORT:-8081}:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/development/nginx:/etc/nginx/conf.d
    depends_on:
      - backend
    networks:
      - folory-network

  frontend:
    build:
      context: ./frontend
      target: dev
    image: folory-frontend  # <-- Burada image adı tanımlanıyor
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8081}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    networks:
      - folory-network
    depends_on:
      - backend

  postgres:
    image: postgres:14
    ports:
        - "5432:5432"
    environment:
      POSTGRES_DB: '${DB_DATABASE:-laravel}'
      POSTGRES_USER: '${DB_USERNAME:-laravel}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    healthcheck:
      # POSTGRES_* ile aynı kullanıcı/veritabanı (root .env'deki DB_* ile uyumlu olmalı)
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - folory-network

  redis:
    image: redis:6-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - folory-network

volumes:
  postgres_data:
  redis_data:

networks:
  folory-network:
    driver: bridge