version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/development/workspace/Dockerfile
    image: folory-backend  # <-- Burada image adı tanımlanıyor
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - APP_URL=http://localhost:8081
    networks:
      - folory-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  webserver:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/development/nginx:/etc/nginx/conf.d
    depends_on:
      - backend
    networks:
      - folory-network

  frontend:
    build:
      context: ./frontend
      target: dev
    image: folory-frontend  # <-- Burada image adı tanımlanıyor
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    networks:
      - folory-network
    depends_on:
      - backend

  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d laravel"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - folory-network

  redis:
    image: redis:6-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - folory-network

volumes:
  postgres_data:
  redis_data:

networks:
  folory-network:
    driver: bridge