# Yerel geliştirme: host'ta 5432 başka bir Postgres kullanıyorsa 5433'e map edilir.
# Frontend portu root .env içindeki FRONTEND_PORT ile ayarlanır (varsayılan 3000).
services:
  postgres:
    ports: !override
      - "5433:5432"

  frontend:
    user: root
    volumes: !override
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next

volumes:
  frontend_node_modules:
  frontend_next_cache:
