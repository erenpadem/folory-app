[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
user=root  # Geçici olarak root kullanıcı ile çalıştır

[program:nginx]
command=/usr/sbin/nginx -g "daemon off; error_log /dev/stderr;"
autostart=true
autorestart=true
startretries=5
startsecs=1
stderr_logfile=/var/log/nginx/error.log
stdout_logfile=/var/log/nginx/access.log
user=root  # Geçici olarak root kullanıcı ile çalıştır

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F -R
autostart=true
autorestart=true
stderr_logfile=/var/log/php-fpm/error.log
stdout_logfile=/var/log/php-fpm/access.log
user=root